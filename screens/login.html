<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dil Punjabi - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex items-center justify-center h-screen">
    <div class="flex flex-col md:flex-row bg-white rounded-lg shadow-lg overflow-hidden w-full max-w-4xl">
        <div class="md:w-1/2 flex flex-col items-center justify-center p-12 bg-red-600 text-white">
            <img src="../assets/dil punjabi logo.png" alt="Dil Punjabi Restaurant Logo" class="h-24 w-24 mb-4">
            <h1 class="text-3xl font-bold mb-2">Welcome To Dil Punjabi</h1>
            <p>The authentic taste of Punjab</p>
        </div>
        <div class="md:w-1/2 p-12">
            <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Login</h2>
            <form id="login-form" action="#">
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" class="w-full p-3 rounded border border-gray-300" required />
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" placeholder="password" class="w-full p-3 rounded border border-gray-300" required />
                </div>
                <div class="text-right mb-4">
                    <a href="#" class="text-red-600 hover:text-red-800">Forget Password?</a>
                </div>
                <button type="submit" class="w-full bg-red-600 text-white p-3 rounded-full hover:bg-red-700">Sign in</button>
            </form>
            <div class="mt-6">
                <div class="flex justify-center space-x-4">
                    <a href="#"><img src="../assets/instagram.png" alt="Instagram" class="h-6 w-6"></a>
                    <a href="#"><img src="../assets/facebook.png" alt="Facebook" class="h-6 w-6"></a>
                    <a href="#"><img src="../assets/linkedin.png" alt="LinkedIn" class="h-6 w-6"></a>
                </div>
                <p class="mt-4 text-center text-gray-600">
                    Don't have an account yet? <a href="#" class="text-red-600 hover:text-red-800">Register for free</a>
                </p>
                 <p class="mt-4 text-center text-gray-600">
                    <a href="index.html" class="text-red-600 hover:text-red-800">Back to Home</a>
                </p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            let isValid = true;
            const inputs = this.querySelectorAll('input');
            inputs.forEach(input => {
                if (!input.value) {
                    isValid = false;
                    input.classList.add('border-red-500');
                } else {
                    input.classList.remove('border-red-500');
                }
            });
            if (!isValid) {
                e.preventDefault();
                alert('Please fill out all fields.');
            }
        });
    </script>
</body>
</html>
